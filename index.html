<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Campaign Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=2026-11-07z">
</head>
<body>
<div id="map"></div>
<div id="map-title" hidden></div>
<div id="party" aria-label="Party"></div>
<div id="dice" aria-label="Dice rolls"></div>
<button id="log-btn" type="button" hidden>Logbook <span id="log-badge" hidden></span></button>
<div id="sound-ctl" hidden></div>
<aside id="logbook" class="sheet" hidden></aside>
<aside id="page" class="sheet" hidden></aside>
<div id="lightbox" hidden><img alt=""></div>
<div id="hint" class="hint" hidden>Click the map where the new pin goes &middot; Esc to cancel</div>
<div id="veil" class="veil" hidden>Publishing&hellip;</div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<script src="js/app.js?v=2026-11-07z"></script>
</body>
</html>
